[workspace]
resolver = "2"
members = [
    "crates/skillsync-core",
    "crates/skillsync-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/skillsync"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

skillsync-core = { path = "crates/skillsync-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
