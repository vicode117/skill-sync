name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend gates (§74): lint, typecheck (tsc -b), vitest, vite build.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Rust gates (§74): fmt, clippy -D warnings, tests. The desktop crate
  # embeds the frontend bundle at compile time, so the frontend is built
  # first. Linux needs the Tauri build prerequisites (webkit2gtk & co).
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend bundle (embedded by tauri codegen)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/cargo-test.log

      - name: Summarize test failures
        if: failure()
        run: |
          {
            echo "## Test failures"
            echo '```'
            grep -E "panicked at|FAILED|failures:|assertion|left:|right:|running [0-9]+ tests|test result" /tmp/cargo-test.log | head -80
            echo '```'
            echo '<details><summary>Last 120 lines of test output</summary>'
            echo
            echo '```'
            tail -120 /tmp/cargo-test.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit as error annotations so the details are readable through the
          # check-run annotations API without repository auth.
          grep -E "panicked at|FAILED|failures:|^test result|assertion .* failed|left:|right:" /tmp/cargo-test.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%%}"
          done

      - name: Build CLI
        run: cargo build --quiet -p skillsync-cli

      - name: CLI smoke test (fresh synthetic home)
        run: |
          HOME_TMP="$(mktemp -d)"
          HOME="$HOME_TMP" ./target/debug/skillsync list
          HOME="$HOME_TMP" ./target/debug/skillsync doctor --json >/dev/null

  # Desktop bundle for the current platform. Gated to manual runs and
  # version tags: macOS runners are the slowest lane, and the compile
  # checks above already guard against breakage.
  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub release and attach assets
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build SkillSync.app (beforeBuildCommand builds the frontend)
        run: pnpm tauri build

      - name: Smoke-check the bundle
        run: |
          APP="target/release/bundle/macos/SkillSync.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/skillsync-desktop"

      - name: Ad-hoc codesign
        run: |
          # Keep a valid ad-hoc signature over all resources; without a
          # Developer ID certificate this is the best we can ship (users
          # clear the quarantine flag once — documented in the notes).
          codesign --force --deep --sign - "target/release/bundle/macos/SkillSync.app"
          codesign --verify --deep "target/release/bundle/macos/SkillSync.app"

      - name: Upload app bundle (runs, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: SkillSync-macos
          path: |
            target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

      # Tag builds become a GitHub release with the app attached.
      - name: Package macOS disk image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          STAGING="$(mktemp -d)"
          cp -R "target/release/bundle/macos/SkillSync.app" "$STAGING/"
          # hdiutil instead of the AppleScript bundler: deterministic in CI.
          hdiutil create \
            -volname "SkillSync" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "SkillSync-${{ github.ref_name }}-aarch64-macos.dmg"
          shasum -a 256 "SkillSync-${{ github.ref_name }}-aarch64-macos.dmg" \
            > "SkillSync-${{ github.ref_name }}-aarch64-macos.dmg.sha256"

      - name: Create GitHub release (macOS assets)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Release notes live in .github/releases/<tag>.md — add one per
          # version when tagging.
          body_path: .github/releases/${{ github.ref_name }}.md
          files: |
            SkillSync-${{ github.ref_name }}-aarch64-macos.dmg
            SkillSync-${{ github.ref_name }}-aarch64-macos.dmg.sha256
          generate_release_notes: true

  # Windows installer (NSIS .exe). Runs after the macOS job so both jobs
  # attach their assets to the same release without racing.
  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    needs: desktop
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # attach the installer to the release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows installer (beforeBuildCommand builds the frontend)
        run: pnpm tauri build

      - name: Package installer
        shell: bash
        run: |
          ls target/release/bundle/nsis/
          mv target/release/bundle/nsis/SkillSync_*-setup.exe \
            "SkillSync-${{ github.ref_name }}-x64-windows-setup.exe"
          sha256sum "SkillSync-${{ github.ref_name }}-x64-windows-setup.exe" \
            > "SkillSync-${{ github.ref_name }}-x64-windows-setup.exe.sha256"

      - name: Create GitHub release (Windows assets)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkillSync-${{ github.ref_name }}-x64-windows-setup.exe
            SkillSync-${{ github.ref_name }}-x64-windows-setup.exe.sha256
